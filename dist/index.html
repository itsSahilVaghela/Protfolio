<script>
(function(){
var bar=document.createElement('div');bar.id='sv-progress';document.body.appendChild(bar);
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var t=e.target;t.classList.add('sv-in');io.unobserve(t);setTimeout(function(){t.classList.remove('sv-reveal','sv-in');t.style.transitionDelay=''},1300)}})},{threshold:.1});
function scan(){document.querySelectorAll('section h2, section p, section [class*="bg-card"], section img').forEach(function(el,i){
 if(el.dataset.svr)return;el.dataset.svr=1;el.classList.add('sv-reveal');el.style.transitionDelay=((i%6)*70)+'ms';io.observe(el)})}
var tm;new MutationObserver(function(){clearTimeout(tm);tm=setTimeout(scan,120)}).observe(document.body,{childList:true,subtree:true});scan();
var mx=0,my=0,sc=0,rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
function onScroll(){var h=document.documentElement;sc=h.scrollTop/Math.max(1,h.scrollHeight-h.clientHeight);bar.style.width=(sc*100)+'%'}
addEventListener('scroll',onScroll,{passive:true});onScroll();
addEventListener('mousemove',function(e){mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5},{passive:true});
document.addEventListener('pointerdown',function(e){var el=e.target.closest&&e.target.closest('button,a[class*="bg-primary"],[class*="bg-card"]');if(!el||rm)return;
 var b=el.getBoundingClientRect(),d=Math.max(b.width,b.height)*2,sp=document.createElement('span');sp.className='sv-rip';
 sp.style.width=sp.style.height=d+'px';sp.style.left=(e.clientX-b.left-d/2)+'px';sp.style.top=(e.clientY-b.top-d/2)+'px';
 if(getComputedStyle(el).position==='static')el.style.position='relative';el.style.overflow='hidden';el.appendChild(sp);setTimeout(function(){sp.remove()},650)});
if(!window.THREE)return;var T=THREE;

var r=new T.WebGLRenderer({canvas:c,antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio,1.75));
var s=new T.Scene();s.fog=new T.Fog(0xf8f9fa,10,30);var cam=new T.PerspectiveCamera(50,1,.1,100);cam.position.z=9;
s.add(new T.AmbientLight(0xffffff,.85));var dl=new T.DirectionalLight(0xffffff,.8);dl.position.set(4,6,6);s.add(dl);
var G=['#4285f4','#ea4335','#fbbc04','#34a853'];
function M(i){return new T.MeshStandardMaterial({color:G[i%4],roughness:.35,metalness:.05})}

var ring=new T.Mesh(new T.TorusGeometry(2.2,.06,16,128),M(0)),ring2=new T.Mesh(new T.TorusGeometry(1.6,.05,16,128),M(1));ring2.rotation.x=1.1;
var core=new T.Mesh(new T.IcosahedronGeometry(.9,1),new T.MeshStandardMaterial({color:0xffffff,roughness:.25,flatShading:true}));
hero.add(ring,ring2,core);var orbs=[];
for(var i=0;i<4;i++){var o=new T.Mesh(new T.SphereGeometry(.28,32,24),M(i));hero.add(o);orbs.push(o)}
var geos=[new T.SphereGeometry(1,24,18),new T.TorusGeometry(1,.35,12,32),new T.OctahedronGeometry(1.1),new T.BoxGeometry(1.4,1.4,1.4)],sh=[];
for(var i=0;i<22;i++){var m=new T.Mesh(geos[i%4],M(i+1));m.position.set((Math.random()-.5)*26,(Math.random()-.5)*14,-2-Math.random()*8);
 m.scale.setScalar(.12+Math.random()*.32);sh.push({m:m,v:.2+Math.random()*.6,o:Math.random()*6,y:m.position.y});s.add(m)}
function rs(){r.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();hero.position.x=cam.aspect>1?3.4:0}
addEventListener('resize',rs);rs();
var clk=new T.Clock();
function loop(){var t=clk.getElapsedTime();
 ring.rotation.y=t*.4;ring.rotation.x=t*.2;ring2.rotation.z=t*.5;core.rotation.x=t*.3;core.rotation.y=t*.4;
 for(var i=0;i<4;i++){var a=t*(.6+i*.15)+i*1.57;if(i%2===0)orbs[i].position.set(Math.cos(a)*2.2,Math.sin(a)*2.2,0);
  else{var yy=Math.sin(a)*1.6;orbs[i].position.set(Math.cos(a)*1.6,yy*Math.cos(1.1),yy*Math.sin(1.1))}}
 hero.position.y=Math.sin(t*.7)*.25+sc*5;hero.rotation.y=sc*2;
 sh.forEach(function(q){q.m.rotation.x=t*q.v;q.m.rotation.y=t*q.v*.8;q.m.position.y=q.y+Math.sin(t*q.v+q.o)*.5});
 cam.position.x+=(mx*1.4-cam.position.x)*.04;cam.position.y+=(-my*1-cam.position.y)*.04;cam.position.z=9-sc*2;cam.lookAt(0,0,0);
 r.render(s,cam);if(!rm)requestAnimationFrame(loop)}
loop();
})();
