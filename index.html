  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var bar=document.createElement('div');bar.id='sv-progress';document.body.appendChild(bar);
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var t=e.target;t.classList.add('sv-in');io.unobserve(t);setTimeout(function(){t.classList.remove('sv-reveal','sv-in');t.style.transitionDelay=''},1400)}})},{threshold:.1});
function scan(){document.querySelectorAll('section h2, section p, section [class*="bg-card"], section img').forEach(function(el,i){
 if(el.dataset.svr)return;el.dataset.svr=1;el.classList.add('sv-reveal');el.style.transitionDelay=((i%6)*80)+'ms';io.observe(el)})}
var tm;new MutationObserver(function(){clearTimeout(tm);tm=setTimeout(scan,120)}).observe(document.body,{childList:true,subtree:true});scan();
var mx=0,my=0,sc=0,rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
function onScroll(){var h=document.documentElement;sc=h.scrollTop/Math.max(1,h.scrollHeight-h.clientHeight);bar.style.width=(sc*100)+'%'}
addEventListener('scroll',onScroll,{passive:true});onScroll();
addEventListener('mousemove',function(e){mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5},{passive:true});
if(matchMedia('(pointer:fine)').matches){var cur=document.createElement('div');cur.id='sv-cur';document.body.appendChild(cur);
 addEventListener('mousemove',function(e){cur.style.transform='translate('+e.clientX+'px,'+e.clientY+'px)';
  cur.classList.toggle('hot',!!(e.target.closest&&e.target.closest('a,button,[class*="bg-card"]')))},{passive:true})}
if(!window.THREE)return;var T=THREE;
var c=document.createElement('canvas');c.id='sv-gl';document.body.prepend(c);
var r=new T.WebGLRenderer({canvas:c,antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio,1.75));
var s=new T.Scene(),cam=new T.PerspectiveCamera(60,1,.1,100);cam.position.z=7;
var n=2200,p=new Float32Array(n*3),col=new Float32Array(n*3),A=new T.Color('#22e1ff'),B=new T.Color('#a855f7'),D=new T.Color('#ffb020');
for(var i=0;i<n;i++){var R=4+Math.random()*14,th=Math.random()*6.283,ph=Math.acos(2*Math.random()-1),k=Math.random(),cc=k<.6?A:k<.9?B:D;
 p[i*3]=R*Math.sin(ph)*Math.cos(th);p[i*3+1]=R*Math.sin(ph)*Math.sin(th)*.7;p[i*3+2]=R*Math.cos(ph);col[i*3]=cc.r;col[i*3+1]=cc.g;col[i*3+2]=cc.b}
var g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(p,3));g.setAttribute('color',new T.BufferAttribute(col,3));
var pts=new T.Points(g,new T.PointsMaterial({size:.05,vertexColors:true,transparent:true,opacity:.85,blending:T.AdditiveBlending,depthWrite:false}));s.add(pts);
var ico=new T.Mesh(new T.IcosahedronGeometry(2.4,1),new T.MeshBasicMaterial({color:0x22e1ff,wireframe:true,transparent:true,opacity:.3}));
var knot=new T.Mesh(new T.TorusKnotGeometry(1.1,.32,160,16),new T.MeshBasicMaterial({color:0xa855f7,wireframe:true,transparent:true,opacity:.4}));
var grp=new T.Group();grp.add(ico,knot);s.add(grp);
function rs(){r.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();grp.position.x=cam.aspect>1?3.2:0}
addEventListener('resize',rs);rs();
var clk=new T.Clock();
function loop(){var t=clk.getElapsedTime();
 pts.rotation.y=t*.02+sc*1.5;ico.rotation.x=t*.15;ico.rotation.y=t*.2+sc*3;knot.rotation.x=-t*.25;knot.rotation.y=t*.3-sc*4;
 ico.scale.setScalar(1+Math.sin(t*1.5)*.03);grp.position.y=.3+sc*5;
 cam.position.x+=(mx*1.6-cam.position.x)*.04;cam.position.y+=(-my*1.1-cam.position.y)*.04;cam.position.z=7-sc*2;cam.lookAt(0,0,0);
 r.render(s,cam);if(!rm)requestAnimationFrame(loop)}
loop();
})();
</script>
